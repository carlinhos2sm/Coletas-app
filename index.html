 const g=id=>document.getElementById(id);if(g('so'))g('so').onclick=async()=>{await sb.auth.signOut();location.reload()};

async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return showAuth();const u=session.user;if((u.user_metadata||{}).must_change_password)return showPwd();const r=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(!r.data)return showAuth('onboard',u);ME=u.id;ROLE=r.data.role;AG=r.data.agency_id;$('#auth').hidden=true;await loadAll();ensureFixed(today());live();tab=(S.users.find(x=>x.id===ME)||{screens:['dash']}).screens[0]||'dash';render()}

let tab='dash',F={acli:'',date:today(),drv:'',st:'',q:'',cq:'',sem:false,cdrv:'',mdrv:''},gm={k:'',i:0};

async function setStatus(id,ns){const k=S.collections.find(x=>x.id===id),r=await sb.from('collections').update({status:ns}).eq('id',id);if(r.error)return toast(r.error.message);if(ns==='A caminho'){startTrack(id);geo(cli(k.clientId))}else if(TRK===id)stopTrack();await loadAll();if(ns==='A caminho')toast('Cliente avisado: motorista a caminho');else if(ns==='Coletado'||ns==='Ausente')toast('Baixa registrada. Próximas paradas reordenadas por proximidade.')}
async function loadPts(id){const r=await sb.from('driver_positions').select('lat,lon,recorded_at').eq('collection_id',id).order('recorded_at',{ascending:false}).limit(300);if(r.data)TRKP[id]=r.data.reverse().map(p=>[p.lat,p.lon,new Date(p.recorded_at).getTime()])}
const leaflet=()=>window.L?Promise.resolve():new Promise((ok,no)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(l);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
async function initMap(){try{MAP&&MAP.remove()}catch(e){}MAP=null;LM={};const el=$('#map');if(!el)return;const k=S.collections.find(x=>x.clientId===F.acli&&x.date===today()&&x.status==='A caminho');if(k)await loadPts(k.id);geo(cli(F.acli)).then(()=>updateMap());try{await leaflet()}catch(e){el.innerHTML='<p class="em">Mapa indisponível sem internet. ETA e posição continuam atualizando.</p>';updateMap();return}if($('#map')!==el)return;MAP=L.map(el).setView([-20.4697,-54.6201],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);updateMap()}
function updateMap(){const k=S.collections.find(x=>x.clientId===F.acli&&x.date===today()&&x.status==='A caminho');if(!k)return;const pts=TRKP[k.id]||[],c=cli(k.clientId),last=pts[pts.length-1],dst=c.geo?[c.geo.lat,c.geo.lon]:null,e=$('#eta'),u=$('#upd');
 if(e)e.textContent=last&&dst?(dist(last,dst)<0.15?'Chegando!':'~'+Math.max(1,Math.round(dist(last,dst)/25*60))+' min · '+dist(last,dst).toFixed(1).replace('.',',')+' km'):(last?'a caminho':'aguardando GPS');
 if(u)u.textContent=last?'Atualizado há '+Math.max(0,Math.round((Date.now()-last[2])/1000))+' s':'Aguardando a primeira localização do motorista…';
 if(!MAP||!window.L)return;const mk=(n,ll,ico)=>{if(LM[n])LM[n].setLatLng(ll);else LM[n]=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="mk">'+ico+'</div>',iconSize:[28,28],iconAnchor:[14,26]})}).addTo(MAP)};
 const line=pts.map(p=>[p[0],p[1]]);if(dst)mk('d',dst,'📍');if(last)mk('m',[last[0],last[1]],'🚚');if(LM.l)LM.l.setLatLngs(line);else LM.l=L.polyline(line,{color:'#2563eb',weight:5,opacity:.8}).addTo(MAP);const all=[...line];if(dst)all.push(dst);if(all.length)MAP.fitBounds(all,{padding:[30,30],maxZoom:16})}
setInterval(()=>{if(tab==='ac')updateMap()},3000);

const XH=['Nome','Telefone','CEP','Rua','Número','Bairro','Cidade','UF'],XK={name:['nome','cliente','empresa','razaosocial','nomefantasia'],phone:['telefone','fone','celular','whatsapp','contato'],cep:['cep'],street:['rua','endereco','logradouro'],number:['numero','num','n'],neighborhood:['bairro'],city:['cidade','municipio'],uf:['uf','estado']};
const xk=h=>String(h||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function importXls(file){if(typeof XLSX==='undefined')return toast('Biblioteca do Excel não carregou. Verifique a internet.');
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
 if(!rows.length)return toast('A planilha está vazia.');
 const map={};Object.keys(rows[0]).forEach(h=>{for(const k in XK)if(!map[k]&&XK[k].includes(xk(h)))map[k]=h});
 if(!map.name)return toast('Não achei a coluna "Nome". Use o modelo Excel.');
 const seen=new Set(S.clients.map(c=>norm(c.name))),add=[];let dup=0,vazio=0;
 rows.forEach(r=>{const g=k=>map[k]?String(r[map[k]]).trim():'',n=g('name');if(!n){vazio++;return}const key=norm(n);if(seen.has(key)){dup++;return}seen.add(key);const cep=g('cep').replace(/\D/g,'');add.push({agency_id:AG,name:n,phone:g('phone')||null,cep:cep.length===8?cep.slice(0,5)+'-'+cep.slice(5):(g('cep')||null),street:g('street')||null,number:g('number')||null,neighborhood:g('neighborhood')||null,city:g('city')||null,uf:g('uf').slice(0,2).toUpperCase()||null,fixed:false,days:[]})});
 if(!add.length)return toast('Nada para importar: '+dup+' já cadastrados, '+vazio+' sem nome.');
 if(!confirm('Importar '+add.length+' cliente(s)?\n'+dup+' já cadastrados (ignorados) e '+vazio+' linhas sem nome (ignoradas).'))return;
 for(let i=0;i<add.length;i+=200){const r=await sb.from('clients').insert(add.slice(i,i+200));if(r.error)return toast('Erro após '+i+' clientes: '+r.error.message)}
 await loadAll();toast(add.length+' cliente(s) importado(s)')}catch(e){toast('Não consegui ler o arquivo: '+e.message)}}
document.addEventListener('change',e=>{if(e.target.id==='xlsf'&&e.target.files[0]){importXls(e.target.files[0]);e.target.value=''}});

async function genLogins(){const me=S.users.find(u=>u.id===ME);if(!me||me.role!=='admin')return toast('Só o administrador pode gerar logins.');
 const L=S.clients.filter(c=>!S.users.some(u=>u.clientId===c.id));if(!L.length)return toast('Todos os clientes já têm login.');
 if(!confirm('Gerar login para '+L.length+' cliente(s)?\nUsuário = primeiro nome (se repetir, vira joao2, joao3…).\nSenha provisória: 12345678 (será trocada no primeiro acesso).'))return;

 if(typeof XLSX!=='undefined'){const ws=XLSX.utils.aoa_to_sheet([['Cliente','Usuário','Senha provisória'],...out.map(x=>[x.out_name,x.out_login,'12345678'])]);ws['!cols']=[{wch:32},{wch:20},{wch:18}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Logins');XLSX.writeFile(wb,'logins_clientes.xlsx')}}
const A={resetpw:async id=>{if(!confirm('Redefinir a senha deste cliente para 12345678? Ele terá que trocar no próximo acesso.'))return;const r=await sb.rpc('reset_client_password',{p_client_id:id});if(r.error)return toast(r.error.message);toast('Senha redefinida para 12345678');cliForm(cli(id))},genone:async id=>{const r=await sb.rpc('create_client_logins',{p_client_ids:[id],p_password:'12345678'});if(r.error)return toast(r.error.message);await loadAll();toast(r.data&&r.data[0]?'Login criado: '+r.data[0].out_login+' / 12345678':'Nada criado');cliForm(cli(id))},genlogins:genLogins,xlsimp:()=>$('#xlsf').click(),xlsmodel:()=>{if(typeof XLSX==='undefined')return toast('Biblioteca do Excel não carregou.');const ws=XLSX.utils.aoa_to_sheet([XH,['Padaria Exemplo','(67) 99999-0000','79002-000','Rua 14 de Julho','100','Centro','Campo Grande','MS']]);ws['!cols']=XH.map(()=>({wch:20}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Clientes');XLSX.writeFile(wb,'modelo_clientes.xlsx')},reqcol:()=>openReq(F.acli).length?toast(MSG1):dlg('Solicitar coleta',fi('date','Data',today(),'type=date required min='+today())+fi('time','Horário preferido','09:00','type=time required')+fi('notes','Observações (opcional)','','',1),async fd=>{const cl=cli(F.acli),n=fd.get('notes');done(await sb.from('collections').insert({agency_id:AG,client_id:F.acli,driver_id:cl.driverId||null,scheduled_date:fd.get('date'),scheduled_time:fd.get('time'),status:'Pendente',notes:'Solicitada pelo cliente'+(n?': '+n:'')}),'Coleta solicitada')}),sim:id=>simulate(id),resume:id=>{startTrack(id);render()},nav:id=>{tab=id;render()},seldrv:id=>{F.cdrv=id;render()},newcol:()=>colForm(),editcol:id=>colForm(S.collections.find(k=>k.id===id)),newcli:()=>cliForm(),editcli:id=>cliForm(cli(id)),newdrv:()=>drvForm(),editdrv:id=>drvForm(drv(id)),newusr:()=>usrForm(),editusr:id=>usrForm(S.users.find(u=>u.id===id)),prt:()=>print(),
 delcol:async id=>{if(confirm('Remover esta coleta?'))done(await sb.from('collections').delete().eq('id',id),'Coleta removida')},

 ger:async()=>{const n=await ensureFixed(F.date===today()||tab==='dash'?today():F.date);toast(n?n+' coleta(s) de rota fixa criada(s)':'Nada novo a gerar para a data.')},
 addroute:()=>{const id=($('[data-cph=rt]')||{}).value;if(!id)return toast('Escolha um cliente.');routeForm(cli(id))},editroute:id=>routeForm(cli(id)),
 rmroute:async id=>{if(confirm('Remover este cliente da rota?'))done(await sb.from('clients').update({fixed:false,driver_id:null,days:[]}).eq('id',id),'Removido da rota')},
 setst:(id,b)=>{const k=S.collections.find(x=>x.id===id);setStatus(id,k.status===b.dataset.s?'Pendente':b.dataset.s)},
 mapsAll:()=>{const pk=ordStops(F.mdrv).filter(k=>['Pendente','A caminho'].includes(k.status)),st=pk.map(k=>full(cli(k.clientId))).filter(Boolean),sa=pk.length-st.length;if(sa)toast(sa+' parada(s) sem endereço ficaram fora da rota.');if(!st.length)return toast('Sem paradas pendentes com endereço.');const key=F.mdrv+st.length;if(gm.k!==key)gm={k:key,i:0};const ch=[];for(let i=0;i<st.length;i+=10)ch.push(st.slice(i,i+10));const p=ch[gm.i],o=gm.i?ch[gm.i-1].at(-1):'';let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+encodeURIComponent(p.at(-1));if(o)u+='&origin='+encodeURIComponent(o);if(p.length>1)u+='&waypoints='+encodeURIComponent(p.slice(0,-1).join('|'));window.open(u,'_blank','noopener');if(ch.length>1)toast('Trecho '+(gm.i+1)+' de '+ch.length+' (10 paradas por link). Toque de novo para o próximo.');gm.i=(gm.i+1)%ch.length}};
